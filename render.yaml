# Render Blueprint — 실시간 서버 (무료 플랜)
# Render 대시보드 → New → Blueprint → 이 저장소 선택
# 웹도 함께 빌드하므로 Render 주소 하나로도 전체 앱이 동작한다.
services:
  - type: web
    name: relay-server
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ROOM_IDLE_MINUTES
        value: 30
      # Vercel 에 화면을 올렸다면 그 주소로 지정 (예: https://definitely-working.vercel.app)
      - key: CORS_ORIGIN
        sync: false
